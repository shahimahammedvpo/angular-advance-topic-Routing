<h2>login</h2>

<form (ngSubmit)="login()">
    <label >username:</label>
    <input type="text"
    name="username"
    required
    [(ngModel)]="username"
    />
    <br><br>

    <label >password:</label>
    <input type="password" 
    name="password"
    required 
    [(ngModel)]="password"/>

    <br><br>
    <button type="submit">login</button>
    </form>
    <p>dont have an account
    <a routerLink="/signup">signup</a>
    </p>
